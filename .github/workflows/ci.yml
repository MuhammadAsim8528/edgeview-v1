name: EdgeView V1 release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeview-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/audit-git-secrets.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/vite-install-boundary.test.mjs
      - run: node --import tsx server/tests/export_blocks_html_safety.test.ts
      - run: node --import tsx server/tests/export_blocks_endpoint.test.ts
      - run: node --import tsx server/tests/search_snippet_email_admission.test.ts
      - run: node --import tsx server/tests/official_page_body_budget.test.ts
      - run: node scripts/build-recovery.test.mjs
      - run: node scripts/build-metadata.test.mjs
      - run: node scripts/local-load-smoke.test.mjs
      - run: node --import tsx server/tests/build_identity_presentation.test.tsx
      - run: node --import tsx server/tests/runtime_usage_presentation.test.tsx
      - run: node scripts/ensure-dependencies.test.mjs
      - run: node scripts/npm-policy-isolation.test.mjs
      - run: node scripts/backup-runtime.test.mjs
      - run: node --experimental-strip-types server/tests/resource_snapshot.test.ts
      - run: node scripts/doctor.test.mjs
      - run: node scripts/generate-sbom.test.mjs
      - run: node scripts/package-preservation.test.mjs
      - run: node --import tsx server/tests/fatal_errors.test.ts
      - run: node --import tsx server/tests/shutdown.test.ts
      - run: node --import tsx server/tests/sqlite_initialization_safety.test.ts
      - run: node --import tsx server/tests/storage_mutation_guard.test.ts
      - run: node --import tsx server/tests/model_credential_origin.test.ts
      - run: node --import tsx server/tests/outbound_retrieval_safety.test.ts
      - run: node --import tsx server/tests/provider_model_discovery_e2e.test.ts
      - run: node scripts/model-test-outcome.test.mjs
      - run: node --import tsx server/tests/provider_settings_runtime_sync.test.ts
      - run: node --import tsx server/tests/config_persistence_safety.test.ts
      - name: Verify Windows user data protection primitive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $sample = [Text.Encoding]::UTF8.GetBytes('synthetic-ci-fixture-only')
          $encrypted = [Security.Cryptography.ProtectedData]::Protect($sample, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
          $restored = [Security.Cryptography.ProtectedData]::Unprotect($encrypted, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
          if ([Convert]::ToBase64String($sample) -ne [Convert]::ToBase64String($restored)) { throw 'Windows user protection round trip failed' }
          Write-Output 'Windows CurrentUser protection primitive passed'
      - run: node --import tsx server/tests/credential_store.test.ts
      - run: node --import tsx server/tests/official_site_crawl.test.ts
      - run: node --import tsx server/tests/config_root_ownership.test.ts
      - run: node --import tsx server/tests/runtime_log_security.test.ts
      - run: node --import tsx server/tests/telemetry_presentation.test.ts
      - run: node --import tsx server/tests/provider_metrics_order.test.ts
      - run: node --import tsx server/tests/provider_response.test.ts
      - run: node --import tsx server/tests/export_selection_validation.test.ts
      - run: node --import tsx server/tests/export_path_boundary.test.ts
      - run: node --import tsx server/tests/text_parse_budget.test.ts
      - run: node --import tsx server/tests/history_provenance.test.ts
      - run: node --import tsx server/tests/export_paging_client.test.ts
      - run: node --import tsx server/tests/provider_diagnostic_payload.test.ts
      - run: node --import tsx server/tests/runtime_capability_recovery.test.ts
      - run: node --import tsx server/tests/batch_snapshot.test.ts
      - run: node --import tsx server/tests/dotenv_test_isolation.test.ts
      - run: node --import tsx server/tests/v1_evidence_maintenance.test.ts
      - run: node --import tsx server/tests/raw_trade_warehouse.test.ts
      - run: node --import tsx server/tests/historical_evidence_preservation.test.ts
      - run: node scripts/verify-release-graph.mjs
      - run: npm run test:v1
      - run: npm run build
      - run: node scripts/build-identity-runtime.test.mjs
      - run: node scripts/telemetry-runtime.test.mjs
      - run: node scripts/history-production-runtime.test.mjs
      - run: node scripts/release-isolation.test.mjs
      - run: npm run test:release
      - run: npm run package:windows
      - run: npm run verify:package
      - run: node scripts/backup-runtime.test.mjs ../../outputs/EdgeView-V1-Windows/scripts/backup-runtime.mjs
      - run: node scripts/package-launch-check.test.mjs
      - run: node scripts/package-cold-runtime.test.mjs
      - run: node scripts/generate-sbom.mjs
      - name: Hash release package
        id: release-files
        shell: pwsh
        run: |
          $archive = (Resolve-Path ../../outputs/EdgeView-V1-Windows.zip).Path
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$digest  EdgeView-V1-Windows.zip" | Set-Content -Encoding utf8NoBOM "$archive.sha256"
          "archive=$archive" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeView-V1-Windows
          path: ${{ steps.release-files.outputs.archive }}*
          if-no-files-found: error
          retention-days: 14

  docker-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target qa --tag edgeview-qa .
      - run: docker run --rm --network none --memory 2g --cpus 2 edgeview-qa

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, docker-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EdgeView-V1-Windows
          path: release
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/EdgeView-V1-Windows.zip release/EdgeView-V1-Windows.zip.sha256 release/EdgeView-V1-Windows.zip.sbom.cdx.json --verify-tag --generate-notes --title "EdgeView $RELEASE_TAG"

