name: Release evidence inventory
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-license-inventory.test.mjs
      - run: node scripts/verify-release-evidence.test.mjs
      - run: node scripts/probe-telemetry-privacy.test.mjs
      - name: Collect lock metadata without installing or running dependencies
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          node scripts/release-license-inventory.mjs > evidence/production-license-metadata.json
      - name: Existing bounded history pattern gate
        run: node scripts/audit-git-secrets.mjs > evidence/history-pattern-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
